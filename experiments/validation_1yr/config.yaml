# Validation of PanSim (20 runs x 52 weeks) against real Hungarian data.

start_date: 2020-09-23        # validation/visualisation start; simulation row 0 = this date
n_days: 364                   # 52 weeks

sim_tsv: results/sim/all_runs.tsv
real_csv: ../../korona_hun(koronahun).csv   # relative to this file
real_encoding: cp1250
real_sep: ";"

hungary_population: 9700000
# Simulated population. null = infer as the day-0 sum of population_columns.
# (default agents.json has 22,364 agents, agents1.json 184,745)
sim_population: null
population_columns: [S, E, I1, I2, I3, I4, I5h, I6h, R_h, R, D1, D2]

# Real data are counts for all of Hungary; they are multiplied by sim_pop / hungary_population
# so that they are comparable with the simulated counts.
rescale_real: true

# Each target: how to build the simulated series and which real column (0-based position in the
# csv, because header names repeat) to compare with.
#   sim:       list of simulator columns that are summed
#   transform: level | cumsum | roll7   (roll7 = 7-day centred mean, applied to sim AND real)
# These state -> real mappings are an interpretation of the compartments: please review.
targets:
  new_cases:
    sim: [NI]
    real_col: 2              # "Új esetek száma"
    transform: roll7
  cumulative_cases:
    sim: [NI]
    real_col: 1              # "Regisztrált esetek száma"
    transform: cumsum
  active_infected:
    sim: [E, I1, I2, I3, I4, I5h, I6h]
    real_col: 11             # "Aktív fertőzöttek száma"
    transform: level
  hospitalized:
    sim: [I5h, I6h]          # NOT the printed column "H" (non-COVID hospitalisation)
    real_col: 19             # "Kórházi ápoltak száma"
    transform: level
  deaths:
    sim: [D1, D2]
    real_col: 3              # "Elhunytak" (cumulative)
    transform: level
